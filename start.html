<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Started</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- Intention overlay — shown once per day -->
  <div class="intention-overlay" id="intentionOverlay">
    <div class="intention-card">
      <span class="intention-label">Morning intention</span>
      <p class="intention-question">What's one thing you want to carry lightly today?</p>

      <div class="intention-chips" id="intentionChips">
        <button class="intention-chip" data-value="Ease">Ease</button>
        <button class="intention-chip" data-value="Presence">Presence</button>
        <button class="intention-chip" data-value="Kindness">Kindness</button>
        <button class="intention-chip" data-value="Surrender">Surrender</button>
        <button class="intention-chip" data-value="Calm">Calm</button>
        <button class="intention-chip" data-value="Gratitude">Gratitude</button>
      </div>

      <input class="intention-input" id="intentionInput" type="text" placeholder="Or write your own…" maxlength="120" />

      <div class="intention-actions">
        <a class="button" id="intentionContinueBtn" href="#">Hold this</a>
        <button class="intention-skip" id="intentionSkipBtn">Skip for today</button>
      </div>
    </div>
  </div>

  <header>
    <div style="display:flex; align-items:center;">
      <img src="Morrow.svg" alt="Morrow logo" style="height:32px; width:auto;">
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="start.html">Focus</a>
      <a href="journal.html">Journal</a>
    </nav>
    <div></div>
  </header>

  <main>
    <h1>Let's begin</h1>
    <p>Take a moment to check in with yourself before you start.</p>

    <label>How are you feeling right now?</label>
    <div class="mood-row" id="moodRow">
      <button class="mood-btn" data-mood="🌑" title="Low">🌑</button>
      <button class="mood-btn" data-mood="🌒" title="Uneasy">🌒</button>
      <button class="mood-btn" data-mood="🌓" title="Neutral">🌓</button>
      <button class="mood-btn" data-mood="🌔" title="Good">🌔</button>
      <button class="mood-btn" data-mood="🌕" title="Great">🌕</button>
    </div>

    <label>What would you like to focus on?</label>
    <div class="custom-select" id="focusDropdown">
      <div class="custom-select__trigger" tabindex="0">
        <span id="focusTriggerText" class="placeholder">Select one...</span>
        <svg width="16" height="16" viewBox="0 0 20 20" fill="gray" xmlns="http://www.w3.org/2000/svg"><polygon points="5,7 15,7 10,12"/></svg>
      </div>
      <div class="custom-select__options" id="focusOptions">
        <!-- options built by JS to support favourites ordering -->
      </div>
    </div>
    <input class="custom-input" id="customFocus" type="text" placeholder="Describe your focus…" maxlength="60" />

    <label>How long would you like to practice?</label>
    <div class="duration-row" id="durationRow">
      <button class="duration-btn" data-minutes="1">1 min</button>
      <button class="duration-btn" data-minutes="3">3 min</button>
      <button class="duration-btn selected" data-minutes="5">5 min</button>
      <button class="duration-btn" data-minutes="10">10 min</button>
    </div>

    <a class="button" href="#" id="continueBtn">Continue</a>
    <a class="back-button" href="index.html">← Back</a>

    <footer>© 2026 Morrow</footer>
  </main>

  <script>
    // ── Intention overlay ────────────────────────────────────────────────────
    const overlay     = document.getElementById("intentionOverlay");
    const intentInput = document.getElementById("intentionInput");
    const continueBtn = document.getElementById("intentionContinueBtn");
    let   intentValue = "";

    function dismissOverlay() {
      overlay.style.opacity = "0";
      overlay.style.transition = "opacity 0.4s ease";
      setTimeout(function () { overlay.style.display = "none"; }, 420);
    }

    function todayKey() {
      const d = new Date();
      return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    }

    if (localStorage.getItem("morrowIntentionDate") === todayKey()) {
      overlay.style.display = "none";
    }

    // Chip selection clears the text input
    document.querySelectorAll(".intention-chip").forEach(function (chip) {
      chip.addEventListener("click", function () {
        document.querySelectorAll(".intention-chip").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected");
        intentValue = chip.dataset.value;
        intentInput.value = "";
      });
    });

    // Typing in the input deselects any chip
    intentInput.addEventListener("input", function () {
      if (intentInput.value.trim()) {
        document.querySelectorAll(".intention-chip").forEach(c => c.classList.remove("selected"));
        intentValue = intentInput.value.trim();
      } else {
        intentValue = "";
      }
    });

    continueBtn.addEventListener("click", function (e) {
      e.preventDefault();
      const text = intentInput.value.trim() || intentValue;
      if (!text) return;
      localStorage.setItem("morrowIntention", text);
      localStorage.setItem("morrowIntentionDate", todayKey());
      dismissOverlay();
    });

    document.getElementById("intentionSkipBtn").addEventListener("click", function () {
      localStorage.setItem("morrowIntentionDate", todayKey());
      dismissOverlay();
    });

    intentInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") continueBtn.click();
    });

    // ── Favourite topics ─────────────────────────────────────────────────────
    const ALL_TOPICS = [
      "Breathing", "Clarity", "Slowing down", "Letting go",
      "Staying present", "Calm energy", "Focus", "Gratitude",
      "Resetting", "Mindfulness"
    ];

    function getFavourites() {
      return JSON.parse(localStorage.getItem("morrowFavTopics") || "[]");
    }

    function setFavourites(favs) {
      localStorage.setItem("morrowFavTopics", JSON.stringify(favs));
    }

    function buildOptions() {
      const favs = getFavourites();
      const optionsList = document.getElementById("focusOptions");
      optionsList.innerHTML = "";

      const favTopics    = ALL_TOPICS.filter(t => favs.includes(t));
      const otherTopics  = ALL_TOPICS.filter(t => !favs.includes(t));

      function makeOption(value, label) {
        const div = document.createElement("div");
        div.className = "option";
        div.dataset.value = value;

        const span = document.createElement("span");
        span.className = "option-label";
        span.textContent = label;
        div.appendChild(span);

        if (value !== "__custom__") {
          const star = document.createElement("button");
          star.className = "option-star" + (favs.includes(value) ? " active" : "");
          star.textContent = "★";
          star.title = favs.includes(value) ? "Remove from favourites" : "Add to favourites";
          star.addEventListener("click", function (e) {
            e.stopPropagation();
            const current = getFavourites();
            const idx = current.indexOf(value);
            if (idx === -1) current.push(value);
            else current.splice(idx, 1);
            setFavourites(current);
            buildOptions();
            // Re-apply selected state if same topic was chosen
            if (focusValue === value) {
              optionsList.querySelectorAll(".option").forEach(function (o) {
                if (o.dataset.value === value) o.classList.add("selected");
              });
            }
          });
          div.appendChild(star);
        }

        div.addEventListener("click", function (e) {
          if (e.target.classList.contains("option-star")) return;
          document.getElementById("focusOptions").querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
          div.classList.add("selected");
          focusValue = value;
          document.getElementById("focusTriggerText").textContent = label;
          document.getElementById("focusTriggerText").classList.remove("placeholder");
          document.getElementById("focusDropdown").classList.remove("open");
          const customInput = document.getElementById("customFocus");
          if (value === "__custom__") {
            customInput.style.display = "block";
            customInput.focus();
          } else {
            customInput.style.display = "none";
          }
        });

        return div;
      }

      if (favTopics.length > 0) {
        favTopics.forEach(t => optionsList.appendChild(makeOption(t, t)));
        const divider = document.createElement("div");
        divider.className = "options-divider";
        optionsList.appendChild(divider);
      }
      otherTopics.forEach(t => optionsList.appendChild(makeOption(t, t)));
      optionsList.appendChild(makeOption("__custom__", "Something else…"));
    }

    buildOptions();

    // ── Mood, duration, dropdown ──────────────────────────────────────────────
    let selectedMood    = "";
    let selectedMinutes = 5;
    let focusValue      = "";

    document.querySelectorAll(".mood-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".mood-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedMood = btn.dataset.mood;
      });
    });

    document.querySelectorAll(".duration-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".duration-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedMinutes = parseInt(btn.dataset.minutes);
      });
    });

    const dropdown = document.getElementById("focusDropdown");
    const trigger  = dropdown.querySelector(".custom-select__trigger");

    trigger.addEventListener("click", function () {
      dropdown.classList.toggle("open");
    });

    trigger.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") dropdown.classList.toggle("open");
      if (e.key === "Escape") dropdown.classList.remove("open");
    });

    document.addEventListener("click", function (e) {
      if (!dropdown.contains(e.target)) dropdown.classList.remove("open");
    });

    // Continue
    document.getElementById("continueBtn").addEventListener("click", function (e) {
      e.preventDefault();
      let topic = focusValue;
      if (topic === "__custom__") {
        topic = document.getElementById("customFocus").value.trim();
        if (!topic) { document.getElementById("customFocus").focus(); return; }
      }
      if (!topic) return;

      const params = new URLSearchParams({
        topic:   topic,
        mood:    selectedMood,
        minutes: selectedMinutes
      });
      window.location.href = "focus.html?" + params.toString();
    });
  </script>

</body>
</html>
